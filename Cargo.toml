[package]
name = "streamdeck-concat"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "concat-plugin"
path = "src/main.rs"

[dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
log = "0.4"
openaction = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "process"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
